name: AutoDocsAI
description: Aplicación móvil de AutoDocs AI - Documentación inteligente de código
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
   # GRÁFICOS
  fl_chart: ^0.68.0
  
  # UI y diseño
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # Navegación y estado
  provider: ^6.1.2
  go_router: ^14.2.0
  
  # Networking
  dio: ^5.4.3+1
  dio_smart_retry: ^6.0.0
  
  # Almacenamiento
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.2
  
  # Utilidades
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  
  # Animaciones
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - .env